name: Build LS Runtime Desktop

on:
  push:
    branches: [ls-runtime-desktop-build]
    paths:
      - 'ls-runtime-parts/**'
      - '.github/workflows/ls-runtime-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and verify LS Runtime source
        shell: bash
        run: |
          python -c "import base64,hashlib,zipfile,pathlib; parts=sorted(pathlib.Path('ls-runtime-parts').glob('part-*.txt')); data=''.join(p.read_text() for p in parts); raw=base64.b64decode(data); expected='853e7e9949ed479595cc181b020037fa602f3a8d7b90ff20dd640f91457a34da'; actual=hashlib.sha256(raw).hexdigest(); print('parts=',len(parts),'bytes=',len(raw),'sha256=',actual); assert actual==expected, f'SHA256 mismatch: {actual}'; z=pathlib.Path('ls-runtime-desktop-source.zip'); z.write_bytes(raw); zipfile.ZipFile(z).testzip() is None or (_ for _ in ()).throw(RuntimeError('ZIP CRC failed')); zipfile.ZipFile(z).extractall('.')"

      - name: Install dependencies
        working-directory: ls-runtime-desktop
        run: npm install

      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: ls-runtime-desktop
        run: npm run dist:win

      - name: Build macOS Universal
        if: runner.os == 'macOS'
        working-directory: ls-runtime-desktop
        run: npm run dist:mac

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LS-Runtime-Windows
          path: |
            ls-runtime-desktop/dist/*.exe
            ls-runtime-desktop/dist/*.yml
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LS-Runtime-macOS
          path: |
            ls-runtime-desktop/dist/*.dmg
            ls-runtime-desktop/dist/*.zip
          if-no-files-found: error
