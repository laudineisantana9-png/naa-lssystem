name: Importar NAA 7.6.0 completo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar pacote público do NAA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .naa-import source.zip
          mkdir -p .naa-import
          URL='https://drive.usercontent.google.com/download?id=1hiryoI-kCmoDELIBysBR5TJdCUnM5xyx&export=download&confirm=t'
          curl -L --fail --retry 4 --retry-delay 2 "$URL" -o source.zip
          unzip -q source.zip -d .naa-import
          test -f .naa-import/NAA_7.6.0_GITHUB_READY/index.html

      - name: Atualizar repositório com o sistema completo
        shell: bash
        run: |
          set -euo pipefail
          SRC='.naa-import/NAA_7.6.0_GITHUB_READY'
          cp -a "$SRC"/. ./
          rm -rf .naa-import source.zip
          git config user.name 'LS System Automation'
          git config user.email 'laudineisantana9@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repositório já está atualizado.'
            exit 0
          fi
          git commit -m 'Publica NAA 7.6.0 completo com comparação entre modalidades'
          git push origin HEAD:main
